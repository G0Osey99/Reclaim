# Reclaim — read-only disk / file / photo recovery core (round 1, CLI).
# Workspace layout follows docs/plan/03-architecture.md §4. Phase 0 ships only
# the block layer, macOS enumeration and the `reclaim` CLI (list/info/doctor).
[workspace]
resolver = "2"
members = [
    "crates/reclaim-block",
    "crates/reclaim-platform-macos",
    "crates/reclaim-sigs",
    "crates/reclaim-carve",
    "crates/reclaim-part",
    "crates/reclaim-fs-core",
    "crates/fs-exfat",
    "crates/fs-fat",
    "crates/fs-ntfs",
    "crates/fs-apfs",
    "crates/fs-hfs",
    "crates/reclaim-session",
    "crates/reclaim-report",
    "crates/reclaim-cli",
]
# Fuzz crates are their own workspace (cargo-fuzz manages fuzz/Cargo.toml);
# exclude them so `cargo build --workspace` on stable ignores the nightly target.
exclude = ["crates/reclaim-carve/fuzz", "crates/reclaim-fs-fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/G0Osey99/reclaim"
authors = ["Reclaim contributors"]

# Workspace-wide lints. `-D warnings` is enforced in CI via `cargo ci`; declaring
# the lint tables here keeps `cargo clippy`/`cargo build` honest for every member.
# The stricter parser-style denies (unwrap/expect/indexing) are added per-crate
# in the crates that touch on-disk bytes (see reclaim-block/src/lib.rs).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Grouped lints; individual denies elevated on top.
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Shared, pinned, all under the deny.toml allow-list (Part 3.3).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
plist = "1"
tempfile = "3"
proptest = "1"
# Phase 1 additions (all MIT/Apache-2.0/BSD — see deny.toml allow-list, Part 3.3).
aho-corasick = "1"                                    # signature matcher (MIT/Unlicense)
memchr = "2"                                          # fast byte scans (MIT/Unlicense)
blake3 = "1"                                          # per-chunk + result hashing (Apache-2.0/CC0)
sha2 = "0.10"                                         # optional SHA-256 for imaging (MIT/Apache-2.0)
crossbeam-channel = "0.5"                             # bounded channels, single-writer (MIT/Apache-2.0)
zstd = "0.13"                                         # optional image compression (MIT; C lib is BSD-3)
toml = "0.8"                                          # catalog parsing in build.rs (MIT/Apache-2.0)
rusqlite = { version = "0.32", features = ["bundled"] } # session store (MIT)
reclaim-block = { path = "crates/reclaim-block" }
reclaim-platform-macos = { path = "crates/reclaim-platform-macos" }
reclaim-sigs = { path = "crates/reclaim-sigs" }
reclaim-carve = { path = "crates/reclaim-carve" }
reclaim-session = { path = "crates/reclaim-session" }
reclaim-report = { path = "crates/reclaim-report" }
# Phase 2 additions (partition schemes + FS metadata engines).
reclaim-part = { path = "crates/reclaim-part" }
reclaim-fs-core = { path = "crates/reclaim-fs-core" }
fs-exfat = { path = "crates/fs-exfat" }
fs-fat = { path = "crates/fs-fat" }
fs-ntfs = { path = "crates/fs-ntfs" }
# Phase 3 additions (APFS + HFS+ metadata engines).
fs-apfs = { path = "crates/fs-apfs" }
fs-hfs = { path = "crates/fs-hfs" }

# Small, safe optimizations for the release CLI; tests stay debuggable.
[profile.release]
opt-level = 3
lto = "thin"
