# cargo-fuzz targets for every reclaim-carve validator (docs/plan/09 §4).
# Standalone crate (own [workspace]); excluded from the main workspace.
[package]
name = "reclaim-carve-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
reclaim-sigs = { path = "../../reclaim-sigs" }

[dependencies.reclaim-carve]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "jpeg"
path = "fuzz_targets/jpeg.rs"
test = false
doc = false
bench = false

