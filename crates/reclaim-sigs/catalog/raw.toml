# Camera RAW (docs/plan/05 §3.2 — all Tier 1; photographers are the primary
# persona). Most are TIFF containers refined by the `tiff` validator's Make/tag
# table; Canon CR3 / Nikon N-RAW / Blackmagic are ISOBMFF. Formats distinguished
# only by the EXIF `Make` tag carry the plain TIFF magic and are refined at
# validation time.

# ---- Distinct-magic RAWs -------------------------------------------------
[[signature]]
id = "raw.cr2"
family = "raw"
extensions = ["cr2"]
mime = "image/x-canon-cr2"
tier = 1
headers = [ { pattern = "49 49 2A 00 10 00 00 00 43 52" } ]
strategy = "structural"
validator = "tiff"
metadata = ["exif"]

[[signature]]
id = "raw.cr3"
family = "raw"
extensions = ["cr3"]
mime = "image/x-canon-cr3"
tier = 1
headers = [ { pattern = "?? ?? ?? ?? 66 74 79 70 63 72 78 20" } ]  # ftyp brand `crx `
strategy = "structural"
validator = "isobmff"
metadata = ["isobmff"]

[[signature]]
id = "raw.crw"
family = "raw"
extensions = ["crw"]
mime = "image/x-canon-crw"
tier = 1
headers = [ { pattern = "49 49 1A 00 00 00 48 45 41 50 43 43 44 52" } ]
strategy = "structural"
metadata = []

[[signature]]
id = "raw.orf"
family = "raw"
extensions = ["orf"]
mime = "image/x-olympus-orf"
tier = 1
headers = [ { pattern = "49 49 52 4F 08 00 00 00" }, { pattern = "49 49 52 53" }, { pattern = "4D 4D 4F 52" } ]
strategy = "structural"
validator = "tiff"
metadata = ["exif"]

[[signature]]
id = "raw.rw2"
family = "raw"
extensions = ["rw2", "rwl"]
mime = "image/x-panasonic-rw2"
tier = 1
# Panasonic uses TIFF magic 0x55 (II U \0). doc 05 listed a 20-byte camera-
# specific tail (IFD offset + content) that varies per file — trimmed to the
# 4-byte discriminator (noted in phase-1.md).
headers = [ { pattern = "49 49 55 00" } ]
strategy = "structural"
validator = "tiff"
metadata = ["exif"]

[[signature]]
id = "raw.raf"
family = "raw"
extensions = ["raf"]
mime = "image/x-fuji-raf"
tier = 1
headers = [ { pattern = "46 55 4A 49 46 49 4C 4D 43 43 44 2D 52 41 57" } ]
