metadata = []

[[signature]]
id = "image.tga"
family = "image"
extensions = ["tga"]
mime = "image/x-tga"
tier = 3
# Footer-anchored: `TRUEVISION-XFILE.\0` at EOF. Detection only (start unknown
# without decoding the header dimensions).
headers = [ { pattern = "54 52 55 45 56 49 53 49 4F 4E 2D 58 46 49 4C 45 2E 00" } ]
strategy = "fixed"
footer_anchored = true
metadata = []

[[signature]]
id = "image.svg"
