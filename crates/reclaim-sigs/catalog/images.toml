tier = 2
headers = [ { pattern = "49 49 2B 00 08 00" }, { pattern = "4D 4D 00 2B 00 08" } ]
strategy = "structural"
validator = "tiff"
metadata = ["exif"]

[[signature]]
id = "image.webp"
family = "image"
extensions = ["webp"]
mime = "image/webp"
tier = 1
headers = [ { pattern = "52 49 46 46 ?? ?? ?? ?? 57 45 42 50" } ]
size = { min = "20B", max = "256MiB" }
strategy = "structural"
validator = "riff"
metadata = []

[[signature]]
id = "image.heif"
family = "image"
extensions = ["heic", "heif", "avif"]
mime = "image/heif"
tier = 1
# ISOBMFF ftyp box: 4-byte size, then `ftyp`; brand at +8. Anchor on `ftyp`.
headers = [ { pattern = "?? ?? ?? ?? 66 74 79 70" } ]
size = { min = "32B", max = "512MiB" }
strategy = "structural"
validator = "isobmff"
metadata = ["isobmff"]

