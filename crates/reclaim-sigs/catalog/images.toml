# Raster images (docs/plan/05 §3.1). Magics taken from the primary format
# specs. Corrections vs doc 05 are noted inline and in docs/build-log/phase-1.md.

[[signature]]
id = "image.jpeg"
family = "image"
extensions = ["jpg", "jpeg", "jpe"]
mime = "image/jpeg"
tier = 1
# One anchor `FF D8 FF ??` covers every SOI+first-marker variant (APP0/APP1/DQT/
# APP2/DHT/COM…) — doc 05 enumerated a subset; the wildcard is exact and broader.
headers = [ { pattern = "FF D8 FF ??" } ]
footer = { pattern = "FF D9", search_max = "256MiB" }
size = { min = "107B", max = "256MiB" }
strategy = "structural"
validator = "jpeg"
metadata = ["exif"]
reassembly = true

[[signature]]
id = "image.png"
family = "image"
extensions = ["png"]
mime = "image/png"
tier = 1
headers = [ { pattern = "89 50 4E 47 0D 0A 1A 0A" } ]
footer = { pattern = "49 45 4E 44 AE 42 60 82", search_max = "256MiB" }
size = { min = "67B", max = "256MiB" }
strategy = "structural"
validator = "png"
metadata = []

[[signature]]
id = "image.gif"
family = "image"
extensions = ["gif"]
mime = "image/gif"
tier = 1
headers = [ { pattern = "47 49 46 38 37 61" }, { pattern = "47 49 46 38 39 61" } ]
footer = { pattern = "3B", search_max = "64MiB" }
size = { min = "35B", max = "64MiB" }
strategy = "structural"
validator = "gif"
metadata = []

[[signature]]
id = "image.bmp"
family = "image"
extensions = ["bmp", "dib"]
mime = "image/bmp"
tier = 1
headers = [ { pattern = "42 4D" } ]
size = { min = "58B", max = "512MiB" }
strategy = "header_size"
validator = "bmp"
metadata = []

[[signature]]
id = "image.tiff"
family = "image"
extensions = ["tif", "tiff"]
mime = "image/tiff"
tier = 1
headers = [ { pattern = "49 49 2A 00" }, { pattern = "4D 4D 00 2A" } ]
size = { min = "16B", max = "1GiB" }
strategy = "structural"
validator = "tiff"
metadata = ["exif"]

[[signature]]
id = "image.bigtiff"
family = "image"
