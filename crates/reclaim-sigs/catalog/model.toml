# 3D, CAD, fonts, geo, misc (docs/plan/05 §3.10).

[[signature]]
id = "model.stl"
family = "model"
extensions = ["stl"]
mime = "model/stl"
tier = 1
# Binary STL: 80-byte header + u32 triangle count → exact size 84 + 50n.
# ASCII STL begins `solid `. The `stl` validator computes the binary size.
headers = [ { pattern = "73 6F 6C 69 64 20" } ]
strategy = "statistical"
validator = "text"
metadata = []

[[signature]]
id = "model.fbx"
family = "model"
extensions = ["fbx"]
mime = "application/octet-stream"
tier = 2
headers = [ { pattern = "4B 61 79 64 61 72 61 20 46 42 58 20 42 69 6E 61 72 79" } ]
strategy = "structural"
metadata = []

[[signature]]
id = "model.gltf"
family = "model"
extensions = ["glb"]
mime = "model/gltf-binary"
tier = 2
headers = [ { pattern = "67 6C 54 46" } ]
strategy = "header_size"
metadata = []

