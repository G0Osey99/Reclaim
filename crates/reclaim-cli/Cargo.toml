[package]
name = "reclaim-cli"
description = "The `reclaim` command-line tool (Phase 0: list / info / doctor)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "reclaim"
path = "src/main.rs"

[features]
# `docgen` compiles the man-page / completion / cli.md generator into the binary
# (invoked via RECLAIM_GEN_DOCS=<dir>). It is NOT part of the shipped binary:
# scripts/gen-cli-docs.sh builds with --features docgen, the release/Recovery
# builds do not. clap_mangen/clap_complete are pure-Rust (no dylib), so even the
# feature build keeps `otool -L` system-libs-only.
docgen = ["dep:clap_mangen", "dep:clap_complete"]

[lints]
workspace = true

[dependencies]
reclaim-block = { path = "../reclaim-block" }
reclaim-platform-macos = { path = "../reclaim-platform-macos" }
reclaim-sigs = { path = "../reclaim-sigs" }
reclaim-carve = { path = "../reclaim-carve" }
reclaim-part = { path = "../reclaim-part" }
reclaim-session = { path = "../reclaim-session" }
reclaim-report = { path = "../reclaim-report" }
fs-apfs = { path = "../fs-apfs" }
clap.workspace = true
comfy-table.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
blake3.workspace = true
# Doc generation only (feature `docgen`); both MIT/Apache-2.0, pure Rust.
clap_mangen = { version = "0.2", optional = true }
clap_complete = { version = "4", optional = true }

[dev-dependencies]
tempfile.workspace = true
